name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npm run browser:install
      - name: Unit tests
        run: npm run test
      - name: Integration tests
        run: RUN_INTEGRATION=1 npm run test -- tests/integration.test.ts tests/locator-finder.integration.test.ts tests/ui-app.integration.test.ts tests/visa-wizard.integration.test.ts

  scaffold-test:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Verify scaffold templates
        run: node scripts/verify-scaffold-templates.mjs
